ref:
  as: quay-copy-app-config
  from: src
  commands: quay-copy-app-config-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Copies the branch-owned Quay app config baseline (ci-generator/config/config.yaml
    from the checked-out quay/quay source) to ${SHARED_DIR}/quay-app-config.yaml for
    quay-deploy-aws-s3 to consume as its config base. Fails if the file is missing or
    not a YAML mapping.

    The effective config quay-deploy-aws-s3 builds is layered in this order:
    1. This repo file (ci-generator/config/config.yaml) is the base.
    2. Infrastructure-only QUAY_EXTRA_CONFIG supplied by the job is merged on top.
    3. Runtime-owned storage/service groups written by quay-deploy-aws-s3 itself
       (USERFILES_*, DISTRIBUTED_*STORAGE_*, PULL_METRICS_REDIS) are applied.
    4. Operator-managed fields are filtered out.
    5. The builder overlay (config_builder.yaml) is folded in last when
       ENABLE_BUILD_SUPPORT=true.

    quay-deploy-aws-s3 falls back to its embedded default config when
    ${SHARED_DIR}/quay-app-config.yaml is absent (e.g. jobs that do not run this step).
